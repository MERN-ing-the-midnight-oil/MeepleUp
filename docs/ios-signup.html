<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MeepleUp - iOS Beta Signup">
  <title>iOS Beta Signup - MeepleUp</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Georgia:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 2rem;
      background: linear-gradient(135deg, #f8f9fa 0%, #ffffff 100%);
    }
    .signup-container {
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    .testflight-image {
      max-width: 100%;
      height: auto;
      margin-bottom: 2rem;
      display: block;
    }
    .signup-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .signup-input {
      width: 100%;
      padding: 1rem 1.25rem;
      font-size: 1rem;
      font-family: var(--font-family);
      border: 2px solid var(--border-color);
      border-radius: 12px;
      background: var(--bg-color);
      color: var(--text-primary);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      box-sizing: border-box;
    }
    .signup-input:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(212, 93, 93, 0.1);
    }
    .signup-button {
      padding: 1rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      color: white;
      background-color: var(--primary-color);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: var(--shadow-md);
    }
    .signup-button:hover {
      background-color: #c04d4d;
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }
    .signup-button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }
    .success-message {
      text-align: center;
      padding: 1.5rem;
      margin-top: 1rem;
      background: linear-gradient(135deg, rgba(212, 93, 93, 0.1) 0%, rgba(255, 255, 255, 0.1) 100%);
      border: 2px solid var(--primary-color);
      border-radius: 12px;
    }
    .success-icon {
      font-size: 3rem;
      display: block;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="signup-container">
    <img src="images/TestFlight.png" alt="TestFlight" class="testflight-image">
    
    <form id="iosSignupForm" class="signup-form">
      <input 
        type="email" 
        id="iosEmailInput" 
        name="email" 
        placeholder="Enter your email" 
        required 
        class="signup-input"
      >
      <button type="submit" class="signup-button">
        Submit
      </button>
    </form>
    
    <div id="iosSuccessMessage" class="success-message" style="display: none;">
      <span class="success-icon">🎉</span>
      <h3>Thank you for signing up!</h3>
      <p>You're on the iOS beta testing list. We'll add you to TestFlight within the next few days.</p>
    </div>
  </div>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  
  <script>
    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyAjVgWb8wApwT1n0hSe_63nI5S3NgROAbI",
      authDomain: "meepleup-951a1.firebaseapp.com",
      projectId: "meepleup-951a1",
      storageBucket: "meepleup-951a1.firebasestorage.app",
      messagingSenderId: "177622732549",
      appId: "1:177622732549:ios:8f4e2f8d53a6060e42716c"
    };
    
    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    
    // iOS form submission
    document.getElementById('iosSignupForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('iosEmailInput').value.trim();
      const form = this;
      const successMessage = document.getElementById('iosSuccessMessage');
      const button = form.querySelector('button');
      
      if (!email || !email.includes('@')) {
        alert('Please enter a valid email address');
        return;
      }
      
      button.disabled = true;
      button.textContent = 'Submitting...';
      
      try {
        await db.collection('betaSignups').add({
          email: email,
          platforms: ['ios'],
          signupDate: firebase.firestore.FieldValue.serverTimestamp(),
          status: 'pending',
          source: 'cascade_con_2026'
        });
        
        form.style.display = 'none';
        successMessage.style.display = 'block';
      } catch (error) {
        console.error('Error:', error);
        alert('Something went wrong. Please try again.');
        button.disabled = false;
        button.textContent = 'Submit';
      }
    });
  </script>
</body>
</html>
